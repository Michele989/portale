<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 100 100" width="200" height="200" role="img" aria-label="Tickly: il punto parte in basso in rosso, sale lungo la linea diventando verde e all'apice esplode in un lampo">
  <defs>
    <path id="percorso" d="M16 50 L27 41 L35 48 L46 63 L82 24"/>
    <filter id="alone" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
  </defs>
  <rect x="4" y="4" width="92" height="92" rx="22" fill="#111712" stroke="#1f2a22" stroke-width="2"/>
  <!-- lampo sul bordo all'apice -->
  <rect x="4" y="4" width="92" height="92" rx="22" fill="none" stroke="#35d07f" stroke-width="2.5" opacity="0">
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;0.9;0;0" keyTimes="0;0.5;0.56;0.72;1"/>
  </rect>
  <!-- linea gialla che si disegna insieme al punto -->
  <g>
    <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="1;1;1;0;0;1" keyTimes="0;0.5;0.78;0.92;0.99;1"/>
    <path d="M16 50 L27 41 L35 48 L46 63 L82 24" fill="none" stroke="#e8b64c" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
      <animate attributeName="stroke-dashoffset" dur="5s" repeatCount="indefinite" values="100;100;0;0" keyTimes="0;0.04;0.5;1" calcMode="linear"/>
    </path>
    <!-- onde all'apice -->
    <circle cx="82" cy="24" r="4" fill="none" stroke="#5dffa0" stroke-width="2.5" opacity="0">
      <animate attributeName="r" dur="5s" repeatCount="indefinite" values="4;4;22;22" keyTimes="0;0.5;0.72;1"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.5;0.53;0.72;1"/>
    </circle>
    <circle cx="82" cy="24" r="4" fill="none" stroke="#35d07f" stroke-width="1.5" opacity="0">
      <animate attributeName="r" dur="5s" repeatCount="indefinite" values="4;4;30;30" keyTimes="0;0.54;0.8;1"/>
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;0.8;0;0" keyTimes="0;0.54;0.57;0.8;1"/>
    </circle>
    <!-- scintille -->
    <g stroke="#5dffa0" stroke-width="2.2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;1;0;0" keyTimes="0;0.5;0.55;0.7;1"/>
      <line x1="82" y1="9" x2="82" y2="14"/><line x1="94" y1="24" x2="89" y2="24"/><line x1="73" y1="15" x2="76.5" y2="18.5"/><line x1="91" y1="15" x2="87.5" y2="18.5"/><line x1="91" y1="33" x2="87.5" y2="29.5"/>
    </g>
    <!-- punto: rosso -> arancio -> verde brillante, segue la linea -->
    <g>
      <circle r="9" fill="#5dffa0" opacity="0" filter="url(#alone)">
        <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.04;0.5;1" calcMode="linear"><mpath xlink:href="#percorso"/></animateMotion>
        <animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0;0.2;0.8;0.2;0" keyTimes="0;0.3;0.5;0.55;0.75;1"/>
      </circle>
      <circle r="4.5" fill="#ff5d5d">
        <animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;0;1;1" keyTimes="0;0.04;0.5;1" calcMode="linear"><mpath xlink:href="#percorso"/></animateMotion>
        <animate attributeName="fill" dur="5s" repeatCount="indefinite" values="#ff5d5d;#ff5d5d;#e8b64c;#35d07f;#5dffa0;#5dffa0" keyTimes="0;0.04;0.28;0.45;0.5;1" calcMode="linear"/>
        <animate attributeName="r" dur="5s" repeatCount="indefinite" values="3.5;3.5;4.5;7;4.5;4.5" keyTimes="0;0.04;0.4;0.52;0.62;1"/>
      </circle>
    </g>
  </g>
</svg>
