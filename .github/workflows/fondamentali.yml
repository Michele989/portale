name: Fondamentali
on:
  workflow_dispatch:

jobs:
  fondamentali:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa gli strumenti
        run: npm install --no-audit --no-fund
        working-directory: strumenti
      - name: Esegui il test dei bilanci
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node --experimental-strip-types --no-warnings strumenti/fondamentali.mjs
      - name: Salva il risultato completo
        uses: actions/upload-artifact@v4
        with:
          name: fondamentali
          path: fondamentali.json
