name: Backup
on:
  schedule: [{ cron: "30 3 * * 0" }]
  workflow_dispatch:
jobs:
  backup:
    if: ${{ vars.BACKUP_ATTIVO == '1' }}
    runs-on: ubuntu-latest
    steps:
      - run: sudo apt-get install -y postgresql-client
      - run: pg_dump "${{ secrets.DATABASE_URL }}" --no-owner --schema=public -Fc -f backup.dump
      - uses: actions/upload-artifact@v4
        with: { name: backup-db, path: backup.dump, retention-days: 30 }
